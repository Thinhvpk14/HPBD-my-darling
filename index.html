<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Hành trình giải đố</title>
    <link rel="stylesheet" href="styles.css?v=57" />
    <script>
      window.APP_VERSION = "57";
      fetch("version.json?t=" + Date.now(), { cache: "no-store" })
        .then((res) => res.json())
        .then((data) => {
          const next = String(data.version);
          if (next === window.APP_VERSION) return;
          const url = new URL(location.href);
          if (url.searchParams.get("v") === next) return;
          url.searchParams.set("v", next);
          location.replace(url.toString());
        })
        .catch(() => {});
    </script>
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <div class="hero-top">
          <p id="campaign-eyebrow" class="eyebrow">Màn 1 / 2</p>
          <p id="app-version" class="app-version"></p>
        </div>
        <h1 id="campaign-title">Đoán mật khẩu</h1>
        <p id="campaign-lede" class="lede"></p>
      </header>

      <nav id="stage-nav" class="stage-nav" hidden aria-hidden="true"></nav>
      <button type="button" id="map-fab" class="map-fab" hidden>Bản đồ</button>

      <section id="journey-map" class="journey" aria-label="Bản đồ hành trình">
        <svg class="journey-path" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <path d="M20 88 C 20 74, 80 76, 80 62 C 80 48, 20 50, 20 36 C 20 24, 80 26, 80 16 C 80 8, 50 6, 50 8" />
        </svg>

        <svg class="tulip tulip-1" viewBox="0 0 40 72" aria-hidden="true">
          <path d="M20 30 L20 70" stroke="#5d8f4a" stroke-width="2.2" fill="none" />
          <path d="M20 50 Q7 44 6 32 Q16 40 20 48 Z" fill="#6aa35a" />
          <path d="M20 52 Q33 46 34 34 Q24 42 20 50 Z" fill="#5d934c" />
          <path d="M20 8 Q10 22 12 34 Q20 28 28 34 Q30 22 20 8 Z" fill="#f4b8c8" />
          <path d="M20 10 Q15 22 20 34 Q25 22 20 10 Z" fill="#e889a8" />
        </svg>
        <svg class="tulip tulip-2" viewBox="0 0 40 72" aria-hidden="true">
          <path d="M20 30 L20 70" stroke="#5d8f4a" stroke-width="2.2" fill="none" />
          <path d="M20 50 Q7 44 6 32 Q16 40 20 48 Z" fill="#6aa35a" />
          <path d="M20 52 Q33 46 34 34 Q24 42 20 50 Z" fill="#5d934c" />
          <path d="M20 8 Q10 22 12 34 Q20 28 28 34 Q30 22 20 8 Z" fill="#fff5f8" />
          <path d="M20 10 Q15 22 20 34 Q25 22 20 10 Z" fill="#f0c9d8" />
        </svg>
        <svg class="tulip tulip-3" viewBox="0 0 40 72" aria-hidden="true">
          <path d="M20 30 L20 70" stroke="#5d8f4a" stroke-width="2.2" fill="none" />
          <path d="M20 50 Q7 44 6 32 Q16 40 20 48 Z" fill="#6aa35a" />
          <path d="M20 8 Q10 22 12 34 Q20 28 28 34 Q30 22 20 8 Z" fill="#c46b86" />
          <path d="M20 10 Q15 22 20 34 Q25 22 20 10 Z" fill="#e8a0b5" />
        </svg>
        <svg class="tulip tulip-4" viewBox="0 0 40 72" aria-hidden="true">
          <path d="M20 30 L20 70" stroke="#5d8f4a" stroke-width="2.2" fill="none" />
          <path d="M20 50 Q7 44 6 32 Q16 40 20 48 Z" fill="#6aa35a" />
          <path d="M20 52 Q33 46 34 34 Q24 42 20 50 Z" fill="#5d934c" />
          <path d="M20 8 Q10 22 12 34 Q20 28 28 34 Q30 22 20 8 Z" fill="#f4b8c8" />
          <path d="M20 10 Q15 22 20 34 Q25 22 20 10 Z" fill="#d4849c" />
        </svg>
        <svg class="tulip tulip-5" viewBox="0 0 40 72" aria-hidden="true">
          <path d="M20 30 L20 70" stroke="#5d8f4a" stroke-width="2.2" fill="none" />
          <path d="M20 52 Q33 46 34 34 Q24 42 20 50 Z" fill="#5d934c" />
          <path d="M20 8 Q10 22 12 34 Q20 28 28 34 Q30 22 20 8 Z" fill="#fff5f8" />
          <path d="M20 10 Q15 22 20 34 Q25 22 20 10 Z" fill="#f4b8c8" />
        </svg>
        <svg class="tulip tulip-6" viewBox="0 0 40 72" aria-hidden="true">
          <path d="M20 30 L20 70" stroke="#5d8f4a" stroke-width="2.2" fill="none" />
          <path d="M20 50 Q7 44 6 32 Q16 40 20 48 Z" fill="#6aa35a" />
          <path d="M20 8 Q10 22 12 34 Q20 28 28 34 Q30 22 20 8 Z" fill="#e889a8" />
          <path d="M20 10 Q15 22 20 34 Q25 22 20 10 Z" fill="#c46b86" />
        </svg>
        <svg class="tulip tulip-7" viewBox="0 0 40 72" aria-hidden="true">
          <path d="M20 30 L20 70" stroke="#5d8f4a" stroke-width="2.2" fill="none" />
          <path d="M20 52 Q33 46 34 34 Q24 42 20 50 Z" fill="#5d934c" />
          <path d="M20 8 Q10 22 12 34 Q20 28 28 34 Q30 22 20 8 Z" fill="#f4b8c8" />
          <path d="M20 10 Q15 22 20 34 Q25 22 20 10 Z" fill="#fff5f8" />
        </svg>
        <svg class="tulip tulip-8" viewBox="0 0 40 72" aria-hidden="true">
          <path d="M20 30 L20 70" stroke="#5d8f4a" stroke-width="2.2" fill="none" />
          <path d="M20 50 Q7 44 6 32 Q16 40 20 48 Z" fill="#6aa35a" />
          <path d="M20 8 Q10 22 12 34 Q20 28 28 34 Q30 22 20 8 Z" fill="#d4849c" />
          <path d="M20 10 Q15 22 20 34 Q25 22 20 10 Z" fill="#e8a0b5" />
        </svg>

        <button type="button" class="map-gate" data-stage="password" aria-label="Cửa 1">
          <span class="map-gate-tag">Cửa 1</span>
          <span class="map-gate-frame"><span class="map-gate-door"></span></span>
        </button>
        <button type="button" class="map-gate" data-stage="color-rings" aria-label="Cửa 2">
          <span class="map-gate-tag">Cửa 2</span>
          <span class="map-gate-frame"><span class="map-gate-door"></span></span>
        </button>
        <button type="button" class="map-gate" data-stage="word-memory" aria-label="Cửa 3">
          <span class="map-gate-tag">Cửa 3</span>
          <span class="map-gate-frame"><span class="map-gate-door"></span></span>
        </button>
        <button type="button" class="map-gate" data-stage="order-memory" aria-label="Cửa 4">
          <span class="map-gate-tag">Cửa 4</span>
          <span class="map-gate-frame"><span class="map-gate-door"></span></span>
        </button>
        <button type="button" id="map-treasure" class="map-treasure is-locked" aria-label="Kho báu đang khóa">
          <span class="map-gate-tag">Kho báu</span>
          <span class="map-chest" aria-hidden="true">
            <svg class="map-chest-svg" viewBox="0 0 72 64">
              <ellipse cx="36" cy="58" rx="22" ry="4" fill="#4a2035" opacity="0.18" />
              <path d="M10 30 L12 18 Q36 6 60 18 L62 30 Z" fill="#d4a24a" />
              <path d="M12 18 Q36 8 60 18" fill="none" stroke="#f0d48a" stroke-width="2" />
              <rect x="8" y="28" width="57" height="26" rx="5" fill="#c48a32" />
              <rect x="8" y="28" width="57" height="8" fill="#a36f22" />
              <rect x="10" y="38" width="52" height="3" rx="1.5" fill="#e8c96a" />
              <rect x="30" y="34" width="12" height="16" rx="2" fill="#e8c96a" />
              <rect x="32" y="40" width="8" height="11" rx="1.6" fill="#5b6472" />
              <path d="M34 40 V35.5 a2.2 2.2 0 0 1 4 0 V40" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" />
              <circle cx="36" cy="46" r="1.2" fill="#e8c96a" />
            </svg>
          </span>
        </button>

        <div id="map-girl" class="map-girl" style="--x: 32%; --y: 76%;">
          <p id="map-bubble" class="map-bubble">Mở cửa này nha~</p>
          <img
            class="girl-photo"
            src="assets/map-portrait.jpg"
            alt=""
            width="160"
            height="160"
          />
        </div>
      </section>

      <div id="stage-root"></div>
    </main>

    <template id="tpl-password">
      <div class="playfield">
        <div class="play-toolbar">
          <button type="button" data-rules class="btn ghost compact">Luật chơi</button>
          <p data-status class="status" aria-live="polite">Lần 1 · sẵn sàng</p>
          <button type="button" data-random class="btn ghost compact">Ngẫu nhiên</button>
        </div>

        <section class="board" aria-live="polite">
          <div data-history class="history"></div>
          <p data-empty-hint class="empty-hint">Chưa có lần đoán. Kết quả sẽ hiện ở đây, ngay trên ô nhập.</p>
        </section>

        <section class="dock">
          <form data-guess-form class="guess-form" autocomplete="off">
            <div data-slots class="slots" role="group" aria-label="5 chữ số"></div>
            <div data-keypad class="keypad" aria-label="Bàn phím số"></div>
            <button type="submit" data-submit class="key key-guess">Đoán</button>
          </form>
        </section>
      </div>

      <div data-rules-modal class="modal" hidden>
        <div class="modal-card rules-card">
          <p class="eyebrow">Luật màn 1</p>
          <h2>Đoán mật khẩu</h2>
          <p class="lede">
            Mật khẩu gồm 5 chữ số, không trùng. Lần đầu đã điền ngẫu nhiên. Gõ thoải mái;
            nếu trùng số thì không bấm được Đoán.
          </p>
          <div class="legend">
            <span class="chip chip-green"><i></i> Xanh · đúng số, đúng vị trí</span>
            <span class="chip chip-yellow"><i></i> Vàng · đúng số, sai vị trí</span>
            <span class="chip chip-red"><i></i> Đỏ · không có số này</span>
            <span class="chip chip-rule"><i></i> Không trùng chữ số</span>
          </div>
          <div class="actions modal-actions">
            <button type="button" data-new-game class="btn ghost">Ván mới</button>
            <button type="button" data-rules-close class="btn primary">Đã hiểu</button>
          </div>
        </div>
      </div>

      <div data-win-modal class="modal" hidden>
        <div class="modal-card">
          <p class="eyebrow">Mở khóa thành công</p>
          <h2>Đúng mật khẩu!</h2>
          <p data-win-text class="lede"></p>
          <div data-win-code class="win-code"></div>
          <div class="actions modal-actions">
            <button type="button" data-replay class="btn ghost">Chơi lại màn này</button>
            <button type="button" data-next class="btn primary">Về bản đồ</button>
          </div>
        </div>
      </div>
    </template>

    <template id="tpl-color-rings">
      <div class="playfield cr-play">
        <section data-start class="cr-start">
          <div class="cr-orb" aria-hidden="true"></div>
          <p class="eyebrow">Màn 2</p>
          <h2>Khóa ba màu</h2>
          <p class="lede">Xoay chấm giữa · Mỗi vòng thêm 1 chấm · Cung ngắn dần</p>
          <button type="button" data-play-btn class="btn primary cr-play-btn">Play</button>
        </section>

        <section data-play class="cr-game" hidden>
          <div class="cr-hud">
            <p data-level class="cr-level">LEVEL 1</p>
            <p data-progress class="cr-progress">0 / 5</p>
            <p data-budget class="cr-budget" hidden></p>
          </div>
          <p data-hint class="cr-hint is-off"></p>
          <div class="cr-stage">
    <svg data-svg class="cr-svg" viewBox="-38 -38 276 276" aria-label="Vòng màu"></svg>
            <div data-sparks class="cr-sparks"></div>
            <p data-feedback class="cr-feedback">Chưa khớp</p>
          </div>
          <div class="cr-controls">
            <button type="button" data-left class="cr-ctrl">Trái</button>
            <button type="button" data-right class="cr-ctrl">Phải</button>
            <button type="button" data-unlock class="cr-ctrl cr-unlock">Mở khóa</button>
          </div>
        </section>

        <div data-win class="modal cr-win" hidden>
          <div class="modal-card">
            <p class="eyebrow">Hoàn thành</p>
            <h2 data-win-title>LEVEL COMPLETE!</h2>
            <p class="cr-progress-lg">5 / 5</p>
            <div class="actions modal-actions">
              <button type="button" data-replay-level class="btn ghost">Replay</button>
              <button type="button" data-next-level class="btn primary">Next Level</button>
            </div>
          </div>
        </div>
      </div>
    </template>

    <template id="tpl-word-memory">
      <div class="playfield wm-play">
        <section data-start class="wm-start">
          <div class="wm-mark" aria-hidden="true">Aa</div>
          <p class="eyebrow">Màn 3</p>
          <h2>Từ mới hay cũ?</h2>
          <p class="lede">30 từ trang sức · mỹ phẩm · thời trang. Trong 30 giây, chọn đúng 10 lần.</p>
          <button type="button" data-play-btn class="btn primary cr-play-btn">Play</button>
        </section>

        <section data-play class="wm-game" hidden>
          <div class="wm-hud">
            <p data-clock class="wm-clock">30.0s</p>
            <p data-score class="wm-score">0 / 10</p>
          </div>
          <div class="wm-timer" aria-hidden="true">
            <div data-timer-fill class="wm-timer-fill"></div>
          </div>
          <div data-stage class="wm-stage">
            <p data-word class="wm-word">Nhẫn</p>
            <p data-feedback class="wm-feedback"></p>
          </div>
          <div class="wm-controls">
            <button type="button" data-new class="wm-btn wm-btn-new">Từ mới</button>
            <button type="button" data-old class="wm-btn wm-btn-old">Đã xuất hiện</button>
          </div>
        </section>

        <div data-win class="modal" hidden>
          <div class="modal-card">
            <p class="eyebrow">Hoàn thành</p>
            <h2>10 / 10 đúng!</h2>
            <p class="lede">Bạn nhận ra đúng từ mới và từ đã xuất hiện.</p>
            <div class="actions modal-actions">
              <button type="button" data-replay-win class="btn ghost">Chơi lại</button>
              <button type="button" data-next class="btn primary">Về bản đồ</button>
            </div>
          </div>
        </div>

        <div data-fail class="modal" hidden>
          <div class="modal-card">
            <p class="eyebrow">Hết giờ</p>
            <h2>Chưa đủ 10 lần đúng</h2>
            <p data-fail-score class="cr-progress-lg">0 / 10</p>
            <div class="actions modal-actions">
              <button type="button" data-replay-fail class="btn primary">Thử lại</button>
            </div>
          </div>
        </div>
      </div>
    </template>

    <template id="tpl-order-memory">
      <div class="playfield om-play">
        <section data-start class="om-start">
          <div class="om-mark" aria-hidden="true">1 2 3</div>
          <p class="eyebrow">Màn 4</p>
          <h2>Sắp đúng thứ tự</h2>
          <p class="lede">Nhìn chuỗi đồ trong vài giây, nhớ thứ tự, rồi xếp lại. 5 vòng, mỗi vòng dài hơn.</p>
          <button type="button" data-play-btn class="btn primary cr-play-btn">Play</button>
        </section>

        <section data-play class="om-game" hidden>
          <div class="om-hud">
            <p class="om-label">Vòng</p>
            <p data-progress class="om-progress">0 / 5</p>
          </div>
          <p data-hint class="om-hint">Nhớ thứ tự này</p>
          <div data-slots class="om-slots"></div>
          <div data-pool class="om-pool"></div>
        </section>

        <div data-win class="modal" hidden>
          <div class="modal-card">
            <p class="eyebrow">Hoàn thành</p>
            <h2>Đúng cả 5 vòng!</h2>
            <p class="lede">Bạn nhớ và xếp lại đúng thứ tự.</p>
            <div class="actions modal-actions">
              <button type="button" data-replay-win class="btn ghost">Chơi lại</button>
              <button type="button" data-next class="btn primary">Về bản đồ</button>
            </div>
          </div>
        </div>
      </div>
    </template>

    <script type="module" src="js/main.js?v=57"></script>
  </body>
</html>
