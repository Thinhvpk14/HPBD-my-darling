<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Hành trình giải đố</title>
    <link rel="stylesheet" href="styles.css?v=43" />
    <script>
      window.APP_VERSION = "43";
      fetch("version.json?t=" + Date.now(), { cache: "no-store" })
        .then((res) => res.json())
        .then((data) => {
          const next = String(data.version);
          if (next === window.APP_VERSION) return;
          const url = new URL(location.href);
          if (url.searchParams.get("v") === next) return;
          url.searchParams.set("v", next);
          location.replace(url.toString());
        })
        .catch(() => {});
    </script>
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <div class="hero-top">
          <p id="campaign-eyebrow" class="eyebrow">Màn 1 / 2</p>
          <p id="app-version" class="app-version"></p>
        </div>
        <h1 id="campaign-title">Đoán mật khẩu</h1>
        <p id="campaign-lede" class="lede"></p>
      </header>

      <nav id="stage-nav" class="stage-nav" aria-label="Các màn chơi"></nav>
      <div id="stage-root"></div>
    </main>

    <template id="tpl-password">
      <div class="playfield">
        <div class="play-toolbar">
          <button type="button" data-rules class="btn ghost compact">Luật chơi</button>
          <p data-status class="status" aria-live="polite">Lần 1 · sẵn sàng</p>
          <button type="button" data-random class="btn ghost compact">Ngẫu nhiên</button>
        </div>

        <section class="board" aria-live="polite">
          <div data-history class="history"></div>
          <p data-empty-hint class="empty-hint">Chưa có lần đoán. Kết quả sẽ hiện ở đây, ngay trên ô nhập.</p>
        </section>

        <section class="dock">
          <form data-guess-form class="guess-form" autocomplete="off">
            <div data-slots class="slots" role="group" aria-label="5 chữ số"></div>
            <div data-keypad class="keypad" aria-label="Bàn phím số"></div>
            <button type="submit" data-submit class="key key-guess">Đoán</button>
          </form>
        </section>
      </div>

      <div data-rules-modal class="modal" hidden>
        <div class="modal-card rules-card">
          <p class="eyebrow">Luật màn 1</p>
          <h2>Đoán mật khẩu</h2>
          <p class="lede">
            Mật khẩu gồm 5 chữ số, không trùng. Lần đầu đã điền ngẫu nhiên. Gõ thoải mái;
            nếu trùng số thì không bấm được Đoán.
          </p>
          <div class="legend">
            <span class="chip chip-green"><i></i> Xanh · đúng số, đúng vị trí</span>
            <span class="chip chip-yellow"><i></i> Vàng · đúng số, sai vị trí</span>
            <span class="chip chip-red"><i></i> Đỏ · không có số này</span>
            <span class="chip chip-rule"><i></i> Không trùng chữ số</span>
          </div>
          <div class="actions modal-actions">
            <button type="button" data-new-game class="btn ghost">Ván mới</button>
            <button type="button" data-rules-close class="btn primary">Đã hiểu</button>
          </div>
        </div>
      </div>

      <div data-win-modal class="modal" hidden>
        <div class="modal-card">
          <p class="eyebrow">Mở khóa thành công</p>
          <h2>Đúng mật khẩu!</h2>
          <p data-win-text class="lede"></p>
          <div data-win-code class="win-code"></div>
          <div class="actions modal-actions">
            <button type="button" data-replay class="btn ghost">Chơi lại màn này</button>
            <button type="button" data-next class="btn primary">Màn tiếp theo</button>
          </div>
        </div>
      </div>
    </template>

    <template id="tpl-color-rings">
      <div class="playfield cr-play">
        <section data-start class="cr-start">
          <div class="cr-orb" aria-hidden="true"></div>
          <p class="eyebrow">Màn 2</p>
          <h2>Khóa ba màu</h2>
          <p class="lede">Xoay chấm giữa · Mỗi vòng thêm 1 chấm · Cung ngắn dần</p>
          <button type="button" data-play-btn class="btn primary cr-play-btn">Play</button>
        </section>

        <section data-play class="cr-game" hidden>
          <div class="cr-hud">
            <p data-level class="cr-level">LEVEL 1</p>
            <p data-progress class="cr-progress">0 / 10</p>
            <p data-budget class="cr-budget" hidden></p>
          </div>
          <p data-hint class="cr-hint is-off"></p>
          <div class="cr-stage">
    <svg data-svg class="cr-svg" viewBox="-96 -96 392 392" aria-label="Vòng màu"></svg>
            <div data-sparks class="cr-sparks"></div>
            <p data-feedback class="cr-feedback">Chưa khớp</p>
          </div>
          <div class="cr-controls">
            <button type="button" data-left class="cr-ctrl">Trái</button>
            <button type="button" data-right class="cr-ctrl">Phải</button>
            <button type="button" data-unlock class="cr-ctrl cr-unlock">Mở khóa</button>
          </div>
        </section>

        <div data-win class="modal cr-win" hidden>
          <div class="modal-card">
            <p class="eyebrow">Hoàn thành</p>
            <h2 data-win-title>LEVEL COMPLETE!</h2>
            <p class="cr-progress-lg">10 / 10</p>
            <div class="actions modal-actions">
              <button type="button" data-replay-level class="btn ghost">Replay</button>
              <button type="button" data-next-level class="btn primary">Next Level</button>
            </div>
          </div>
        </div>
      </div>
    </template>

    <template id="tpl-word-memory">
      <div class="playfield wm-play">
        <section data-start class="wm-start">
          <div class="wm-mark" aria-hidden="true">Aa</div>
          <p class="eyebrow">Màn 3</p>
          <h2>Từ mới hay cũ?</h2>
          <p class="lede">30 từ trang sức · mỹ phẩm · thời trang. Trong 30 giây, chọn đúng 30 lần.</p>
          <button type="button" data-play-btn class="btn primary cr-play-btn">Play</button>
        </section>

        <section data-play class="wm-game" hidden>
          <div class="wm-hud">
            <p data-clock class="wm-clock">30.0s</p>
            <p data-score class="wm-score">0 / 30</p>
          </div>
          <div class="wm-timer" aria-hidden="true">
            <div data-timer-fill class="wm-timer-fill"></div>
          </div>
          <div data-stage class="wm-stage">
            <p data-word class="wm-word">Nhẫn</p>
            <p data-feedback class="wm-feedback"></p>
          </div>
          <div class="wm-controls">
            <button type="button" data-new class="wm-btn wm-btn-new">Từ mới</button>
            <button type="button" data-old class="wm-btn wm-btn-old">Đã xuất hiện</button>
          </div>
        </section>

        <div data-win class="modal" hidden>
          <div class="modal-card">
            <p class="eyebrow">Hoàn thành</p>
            <h2>30 / 30 đúng!</h2>
            <p class="lede">Bạn nhận ra đúng từ mới và từ đã xuất hiện.</p>
            <div class="actions modal-actions">
              <button type="button" data-replay-win class="btn ghost">Chơi lại</button>
              <button type="button" data-next class="btn primary">Màn tiếp theo</button>
            </div>
          </div>
        </div>

        <div data-fail class="modal" hidden>
          <div class="modal-card">
            <p class="eyebrow">Hết giờ</p>
            <h2>Chưa đủ 30 lần đúng</h2>
            <p data-fail-score class="cr-progress-lg">0 / 30</p>
            <div class="actions modal-actions">
              <button type="button" data-replay-fail class="btn primary">Thử lại</button>
            </div>
          </div>
        </div>
      </div>
    </template>

    <template id="tpl-order-memory">
      <div class="playfield om-play">
        <section data-start class="om-start">
          <div class="om-mark" aria-hidden="true">1 2 3</div>
          <p class="eyebrow">Màn 4</p>
          <h2>Sắp đúng thứ tự</h2>
          <p class="lede">Nhìn chuỗi đồ trong vài giây, nhớ thứ tự, rồi xếp lại. 5 vòng, mỗi vòng dài hơn.</p>
          <button type="button" data-play-btn class="btn primary cr-play-btn">Play</button>
        </section>

        <section data-play class="om-game" hidden>
          <div class="om-hud">
            <p class="om-label">Vòng</p>
            <p data-progress class="om-progress">0 / 5</p>
          </div>
          <p data-hint class="om-hint">Nhớ thứ tự này</p>
          <div data-slots class="om-slots"></div>
          <div data-pool class="om-pool"></div>
        </section>

        <div data-win class="modal" hidden>
          <div class="modal-card">
            <p class="eyebrow">Hoàn thành</p>
            <h2>Đúng cả 5 vòng!</h2>
            <p class="lede">Bạn nhớ và xếp lại đúng thứ tự.</p>
            <div class="actions modal-actions">
              <button type="button" data-replay-win class="btn ghost">Chơi lại</button>
              <button type="button" data-next class="btn primary">Màn tiếp theo</button>
            </div>
          </div>
        </div>
      </div>
    </template>

    <script type="module" src="js/main.js?v=43"></script>
  </body>
</html>
